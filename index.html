<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To-Do</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #F7F5F0; --surface: #FFFFFF; --border: #E8E3DC;
    --text: #1A1714; --muted: #8A8278; --radius: 14px;
    --shadow: 0 2px 16px rgba(0,0,0,0.07);
    --green: #1E8449; --red: #C0392B;
  }

  body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; padding:28px 16px 100px; }
  .wrap { max-width:660px; margin:0 auto; }

  header { margin-bottom:24px; }
  h1 { font-family:'DM Serif Display',serif; font-size:clamp(2rem,6vw,2.8rem); letter-spacing:-0.5px; line-height:1; margin-bottom:4px; }
  .header-sub { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .subtitle { color:var(--muted); font-size:0.84rem; }

  .sync-badge {
    display:inline-flex; align-items:center; gap:5px;
    font-size:0.72rem; font-weight:500; padding:3px 9px; border-radius:999px;
    border:1px solid var(--border); background:var(--surface); color:var(--muted);
    transition:all 0.3s; white-space:nowrap; cursor:default;
  }
  .sync-badge.synced { color:var(--green); border-color:#c3e6cb; background:#f0faf4; }
  .sync-badge.saving { color:#b7860b; border-color:#f5e4a0; background:#fffdf0; }
  .sync-badge.error  { color:var(--red); border-color:#f5c6cb; background:#fff5f5; }
  .sync-dot { width:6px; height:6px; border-radius:50%; background:currentColor; flex-shrink:0; }
  .sync-badge.saving .sync-dot { animation:pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  /* Sign-in screen */
  .signin-screen {
    position:fixed; inset:0; background:var(--bg);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:20px; z-index:500; transition:opacity 0.3s;
  }
  .signin-screen.hidden { opacity:0; pointer-events:none; }
  .signin-title { font-family:'DM Serif Display',serif; font-size:2rem; }
  .signin-sub { color:var(--muted); font-size:0.88rem; text-align:center; max-width:280px; line-height:1.5; }
  .signin-btn {
    display:flex; align-items:center; gap:10px; padding:12px 22px;
    border-radius:10px; border:1.5px solid var(--border);
    background:var(--surface); color:var(--text);
    font-family:'DM Sans',sans-serif; font-size:0.92rem; font-weight:500;
    cursor:pointer; box-shadow:var(--shadow); transition:box-shadow 0.15s, transform 0.1s;
  }
  .signin-btn:hover { box-shadow:0 4px 20px rgba(0,0,0,0.12); transform:translateY(-1px); }

  /* Loading */
  .loading-screen {
    position:fixed; inset:0; background:var(--bg);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; z-index:400; transition:opacity 0.3s;
  }
  .loading-screen.hidden { opacity:0; pointer-events:none; }
  .loading-title { font-family:'DM Serif Display',serif; font-size:1.4rem; }
  .loading-sub { color:var(--muted); font-size:0.84rem; }
  .spinner { width:28px; height:28px; border:3px solid var(--border); border-top-color:var(--text); border-radius:50%; animation:spin 0.8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* Controls */
  .controls-card { background:var(--surface); border:1.5px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:16px; overflow:hidden; }
  .add-section { display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--border); }
  .add-input { flex:1; border:none; outline:none; font-family:'DM Sans',sans-serif; font-size:0.95rem; color:var(--text); background:transparent; min-width:0; }
  .add-input::placeholder { color:#C5BFB7; }
  .cat-select-wrap { position:relative; }
  .cat-select-wrap select { appearance:none; -webkit-appearance:none; border:1.5px solid var(--border); border-radius:999px; padding:5px 28px 5px 10px; font-family:'DM Sans',sans-serif; font-size:0.78rem; font-weight:500; color:var(--text); background:var(--bg); cursor:pointer; outline:none; min-width:110px; max-width:160px; }
  .cat-select-wrap::after { content:'▾'; position:absolute; right:9px; top:50%; transform:translateY(-50%); font-size:0.7rem; color:var(--muted); pointer-events:none; }
  .add-btn { width:32px; height:32px; border-radius:50%; border:none; background:var(--text); color:#fff; font-size:1.2rem; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:background 0.15s,transform 0.1s; }
  .add-btn:hover { background:#333; transform:scale(1.07); }
  .filter-row { display:flex; align-items:center; gap:6px; padding:10px 16px; }
  .filter-btn { padding:5px 14px; border-radius:999px; border:1.5px solid var(--border); background:transparent; color:var(--muted); font-family:'DM Sans',sans-serif; font-size:0.78rem; font-weight:500; cursor:pointer; transition:all 0.15s; }
  .filter-btn.active { background:var(--text); color:#fff; border-color:var(--text); }
  .filter-btn:hover:not(.active) { border-color:var(--text); color:var(--text); }
  .row-spacer { flex:1; }
  .manage-btn { padding:5px 12px; border-radius:999px; border:1.5px dashed var(--border); background:transparent; color:var(--muted); font-family:'DM Sans',sans-serif; font-size:0.78rem; cursor:pointer; transition:all 0.15s; }
  .manage-btn:hover { border-color:var(--text); color:var(--text); }

  /* Category panel */
  .cat-panel { display:none; background:var(--surface); border:1.5px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:16px; overflow:hidden; }
  .cat-panel.open { display:block; }
  .cat-panel-header { display:flex; align-items:center; justify-content:space-between; padding:13px 16px 12px; border-bottom:1px solid var(--border); background:#FAFAF8; }
  .cat-panel-header span { font-family:'DM Serif Display',serif; font-size:1rem; }
  .add-cat-btn { padding:4px 12px; border-radius:999px; border:1.5px dashed var(--border); background:transparent; color:var(--muted); font-family:'DM Sans',sans-serif; font-size:0.76rem; cursor:pointer; transition:all 0.15s; }
  .add-cat-btn:hover { border-color:var(--text); color:var(--text); }
  .cat-row { display:flex; align-items:center; gap:10px; padding:10px 16px; border-bottom:1px solid var(--border); }
  .cat-row:last-child { border-bottom:none; }
  .cat-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; cursor:pointer; transition:transform 0.15s; }
  .cat-dot:hover { transform:scale(1.4); }
  .cat-name-input { flex:1; border:none; outline:none; background:transparent; font-family:'DM Sans',sans-serif; font-size:0.88rem; color:var(--text); min-width:0; border-bottom:1px solid transparent; padding-bottom:1px; }
  .cat-name-input:focus { border-bottom-color:var(--muted); }
  .cat-count-badge { font-size:0.72rem; color:var(--muted); background:var(--bg); border-radius:999px; padding:2px 7px; flex-shrink:0; }
  .icon-btn { width:28px; height:28px; border-radius:7px; border:none; background:transparent; cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:0.9rem; transition:background 0.1s,color 0.1s; -webkit-tap-highlight-color:transparent; flex-shrink:0; }
  .icon-btn:hover { background:var(--bg); color:var(--text); }
  .icon-btn:disabled { opacity:0.25; cursor:default; }
  .icon-btn:disabled:hover { background:transparent; color:var(--muted); }
  .icon-btn.danger:hover { background:#fee2e2; color:#c0392b; }

  /* Task list */
  .task-list-card { background:var(--surface); border:1.5px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; }
  .group-header { display:flex; align-items:center; gap:8px; padding:10px 16px 8px; background:#FAFAF8; border-bottom:1px solid var(--border); }
  .group-header:not(:first-child) { border-top:2px solid var(--border); }
  .group-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .group-label { font-family:'DM Serif Display',serif; font-size:0.9rem; flex:1; }
  .group-count { font-size:0.72rem; color:var(--muted); }
  .task-row { display:flex; align-items:flex-start; gap:11px; padding:10px 16px; transition:background 0.1s; border-bottom:1px solid var(--border); }
  .task-row:last-child { border-bottom:none; }
  .task-row:hover { background:#FAFAF8; }
  .task-check { width:18px; height:18px; border-radius:50%; border:2px solid var(--border); flex-shrink:0; margin-top:1px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.15s; background:#fff; }
  .task-check.checked { background:var(--cc); border-color:var(--cc); }
  .task-check.checked::after { content:''; width:5px; height:9px; border:2px solid white; border-top:none; border-left:none; transform:rotate(40deg) translateY(-1px); display:block; }
  .task-text { flex:1; font-size:0.9rem; line-height:1.45; word-break:break-word; outline:none; cursor:text; border-bottom:1px solid transparent; padding-bottom:1px; }
  .task-text:focus { border-bottom-color:var(--muted); }
  .task-text.done { text-decoration:line-through; color:var(--muted); }
  .task-del { opacity:0; margin-top:1px; transition:opacity 0.15s; flex-shrink:0; }
  .task-row:hover .task-del { opacity:1; }
  .empty-group { padding:12px 16px; color:var(--muted); font-size:0.82rem; font-style:italic; border-bottom:1px solid var(--border); }
  .empty-group:last-child { border-bottom:none; }
  .empty-all { padding:40px 16px; text-align:center; color:var(--muted); font-size:0.88rem; font-style:italic; }

  /* Modal */
  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.3); z-index:300; align-items:center; justify-content:center; padding:20px; }
  .modal-overlay.open { display:flex; }
  .modal { background:var(--surface); border-radius:16px; padding:22px 20px 20px; width:100%; max-width:340px; box-shadow:0 20px 60px rgba(0,0,0,0.2); }
  .modal h2 { font-family:'DM Serif Display',serif; font-size:1.2rem; margin-bottom:14px; }
  .modal input[type=text] { width:100%; padding:9px 13px; border:1.5px solid var(--border); border-radius:8px; font-family:'DM Sans',sans-serif; font-size:0.92rem; outline:none; margin-bottom:12px; color:var(--text); }
  .modal input[type=text]:focus { border-color:var(--text); }
  .color-grid { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px; }
  .swatch { width:28px; height:28px; border-radius:50%; cursor:pointer; border:3px solid transparent; transition:transform 0.12s; }
  .swatch.sel { border-color:var(--text); transform:scale(1.18); }
  .modal-btns { display:flex; gap:8px; justify-content:flex-end; }
  .btn { padding:8px 18px; border-radius:8px; border:none; font-family:'DM Sans',sans-serif; font-size:0.86rem; font-weight:500; cursor:pointer; transition:all 0.13s; }
  .btn-ghost { background:var(--bg); color:var(--muted); }
  .btn-ghost:hover { color:var(--text); }
  .btn-primary { background:var(--text); color:#fff; }
  .btn-primary:hover { background:#333; }
</style>
</head>
<body>

<!-- Sign-in screen -->
<div class="signin-screen" id="signin-screen">
  <div class="signin-title">To‑Do</div>
  <div class="signin-sub">Sign in with Google to load and sync your list across all devices.</div>
  <button class="signin-btn" onclick="signIn()">
    <svg class="google-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
      <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
      <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
      <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
    </svg>
    Sign in with Google
  </button>
</div>

<!-- Loading screen -->
<div class="loading-screen hidden" id="loading-screen">
  <div class="spinner"></div>
  <div class="loading-title">To‑Do</div>
  <div class="loading-sub" id="loading-sub">Syncing with Google Drive…</div>
</div>

<div class="wrap">
  <header>
    <h1>To‑Do</h1>
    <div class="header-sub">
      <p class="subtitle" id="stats-line">Loading…</p>
      <span class="sync-badge synced" id="sync-badge">
        <span class="sync-dot"></span>
        <span id="sync-label">Synced</span>
      </span>
    </div>
  </header>

  <div class="controls-card">
    <div class="add-section">
      <input class="add-input" id="add-input" placeholder="New task…" onkeydown="if(event.key==='Enter') addTask()" />
      <div class="cat-select-wrap"><select id="cat-select"></select></div>
      <button class="add-btn" onclick="addTask()">+</button>
    </div>
    <div class="filter-row">
      <button class="filter-btn active" data-f="all"    onclick="setFilter(this)">All</button>
      <button class="filter-btn"        data-f="active" onclick="setFilter(this)">Active</button>
      <button class="filter-btn"        data-f="done"   onclick="setFilter(this)">Done</button>
      <span class="row-spacer"></span>
      <button class="manage-btn" onclick="togglePanel()">Manage categories</button>
    </div>
  </div>

  <div class="cat-panel" id="cat-panel">
    <div class="cat-panel-header">
      <span>Categories</span>
      <button class="add-cat-btn" onclick="openModal('add-cat')">+ Add category</button>
    </div>
    <div id="cat-rows"></div>
  </div>

  <div class="task-list-card" id="task-list"></div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal-overlay" onclick="overlayClick(event)">
  <div class="modal">
    <h2 id="modal-title">New Category</h2>
    <input type="text" id="modal-name" placeholder="Category name" />
    <div class="color-grid" id="color-grid"></div>
    <div class="modal-btns">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveModal()">Save</button>
    </div>
  </div>
</div>

<!-- Google Identity Services -->
<script src="https://accounts.google.com/gsi/client" async></script>

<script>
// ── Config ────────────────────────────────────────────
const CLIENT_ID   = '233056598860-idosa26pg3t8eitpret215g2j27s0dlg.apps.googleusercontent.com';
const FILE_NAME   = 'todo-grouped-v1.json';
const MIME        = 'application/json';
const SCOPES      = 'https://www.googleapis.com/auth/drive.appdata https://www.googleapis.com/auth/drive.file';
const LOCAL_KEY   = 'todo-grouped-v1-cache';
const TOKEN_KEY   = 'todo-gtoken';

const PALETTE = ['#C0392B','#E74C3C','#D35400','#D68910','#1E8449','#17A589','#2471A3','#1A5276','#7D3C98','#6C3483','#626567','#2C3E50'];
const DEFAULTS = [
  { id:'high',      name:'High Priority',      color:'#C0392B', tasks:[] },
  { id:'house',     name:'House',              color:'#2471A3', tasks:[] },
  { id:'health',    name:'Health',             color:'#1E8449', tasks:[] },
  { id:'financial', name:'Financial',          color:'#7D3C98', tasks:[] },
  { id:'trips',     name:'Trips & Activities', color:'#D68910', tasks:[] },
];

let state       = { categories:[], filter:'all' };
let accessToken = null;
let driveFileId = null;
let saveTimer   = null;
let modalMode   = null, modalCatId = null, pickedColor = PALETTE[0];

// ── Auth ──────────────────────────────────────────────
function signIn() {
  const client = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPES,
    callback: async (resp) => {
      if (resp.error) { console.error(resp); return; }
      accessToken = resp.access_token;
      localStorage.setItem(TOKEN_KEY, accessToken);
      showLoading('Syncing with Google Drive…');
      hideSignIn();
      await boot();
    }
  });
  client.requestAccessToken();
}

function showLoading(msg) {
  document.getElementById('loading-sub').textContent = msg || 'Loading…';
  document.getElementById('loading-screen').classList.remove('hidden');
}
function hideLoading() { document.getElementById('loading-screen').classList.add('hidden'); }
function hideSignIn()  { document.getElementById('signin-screen').classList.add('hidden'); }

// ── Sync badge ────────────────────────────────────────
function setSyncBadge(status, label) {
  const badge = document.getElementById('sync-badge');
  badge.className = `sync-badge ${status}`;
  document.getElementById('sync-label').textContent = label;
}

// ── Drive API ─────────────────────────────────────────
async function driveReq(url, options = {}) {
  const resp = await fetch(url, {
    ...options,
    headers: { 'Authorization': `Bearer ${accessToken}`, ...(options.headers || {}) }
  });
  if (resp.status === 401) {
    // Token expired — prompt re-auth
    accessToken = null;
    localStorage.removeItem(TOKEN_KEY);
    document.getElementById('signin-screen').classList.remove('hidden');
    throw new Error('Token expired');
  }
  return resp;
}

async function findOrCreateFile() {
  // Search in appDataFolder and drive for our file
  const search = await driveReq(
    `https://www.googleapis.com/drive/v3/files?q=name%3D'${FILE_NAME}'%20and%20trashed%3Dfalse&spaces=drive&fields=files(id,name)`
  );
  const data = await search.json();
  if (data.files && data.files.length > 0) {
    return data.files[0].id;
  }
  // Create it
  const meta = { name: FILE_NAME, mimeType: MIME };
  const create = await driveReq('https://www.googleapis.com/drive/v3/files', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(meta)
  });
  const created = await create.json();
  // Upload default content
  await uploadContent(created.id, JSON.stringify({ categories: JSON.parse(JSON.stringify(DEFAULTS)), filter: 'all' }));
  return created.id;
}

async function loadFile(fileId) {
  const resp = await driveReq(
    `https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`
  );
  const text = await resp.text();
  return JSON.parse(text);
}

async function uploadContent(fileId, content) {
  await driveReq(
    `https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`,
    {
      method: 'PATCH',
      headers: { 'Content-Type': MIME },
      body: content
    }
  );
}

// ── Save ──────────────────────────────────────────────
function scheduleSave() {
  clearTimeout(saveTimer);
  setSyncBadge('saving', 'Saving…');
  saveTimer = setTimeout(async () => {
    try {
      const json = JSON.stringify(state);
      localStorage.setItem(LOCAL_KEY, json);
      if (driveFileId && accessToken) {
        await uploadContent(driveFileId, json);
      }
      setSyncBadge('synced', 'Synced');
    } catch(e) {
      console.warn('Save failed:', e);
      setSyncBadge('error', 'Sync failed');
    }
  }, 1500);
}

// ── Boot ──────────────────────────────────────────────
async function boot() {
  // Load from cache instantly
  const cached = localStorage.getItem(LOCAL_KEY);
  if (cached) { try { state = JSON.parse(cached); render(); } catch(e) {} }

  try {
    driveFileId = await findOrCreateFile();
    const fresh = await loadFile(driveFileId);
    state = fresh;
    localStorage.setItem(LOCAL_KEY, JSON.stringify(state));
    setSyncBadge('synced', 'Synced');
    render();
  } catch(e) {
    console.warn('Drive load failed:', e);
    if (!cached) {
      state = { categories: JSON.parse(JSON.stringify(DEFAULTS)), filter:'all' };
      render();
    }
    setSyncBadge('error', 'Sync failed');
  }
  hideLoading();
}

// ── Init ──────────────────────────────────────────────
window.addEventListener('load', () => {
  // Try to reuse saved token
  const saved = localStorage.getItem(TOKEN_KEY);
  if (saved) {
    accessToken = saved;
    hideSignIn();
    showLoading('Syncing with Google Drive…');
    boot();
  }
  // else: sign-in screen stays visible
});

// ── Helpers ──────────────────────────────────────────
function uid() { return Math.random().toString(36).slice(2,9); }
function getCat(id) { return state.categories.find(c => c.id === id); }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ── Filter ───────────────────────────────────────────
function setFilter(btn) {
  state.filter = btn.dataset.f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  scheduleSave(); renderList();
}
function togglePanel() { document.getElementById('cat-panel').classList.toggle('open'); }

// ── Render ───────────────────────────────────────────
function render() {
  renderCatSelect(); renderCatPanel(); renderList();
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.f === state.filter);
  });
}

function renderCatSelect() {
  const sel = document.getElementById('cat-select');
  const prev = sel.value;
  sel.innerHTML = state.categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
  if (state.categories.find(c => c.id === prev)) sel.value = prev;
}

function renderCatPanel() {
  document.getElementById('cat-rows').innerHTML = state.categories.map((cat, idx) => {
    const done = cat.tasks.filter(t => t.done).length;
    return `<div class="cat-row">
      <div class="cat-dot" style="background:${cat.color}" onclick="openModal('edit-cat','${cat.id}')"></div>
      <input class="cat-name-input" value="${esc(cat.name)}" onchange="renameCat('${cat.id}',this.value)" />
      <span class="cat-count-badge">${done}/${cat.tasks.length}</span>
      <button class="icon-btn" onclick="moveCat('${cat.id}',-1)" ${idx===0?'disabled':''}>↑</button>
      <button class="icon-btn" onclick="moveCat('${cat.id}',1)" ${idx===state.categories.length-1?'disabled':''}>↓</button>
      <button class="icon-btn danger" onclick="deleteCat('${cat.id}')">✕</button>
    </div>`;
  }).join('');
}

function renderList() {
  const el = document.getElementById('task-list');
  const f = state.filter;
  let html = '', totalActive = 0, totalDone = 0, anyVisible = false;
  state.categories.forEach(cat => {
    const visible = cat.tasks.filter(t => f==='all'?true:f==='active'?!t.done:t.done);
    totalActive += cat.tasks.filter(t => !t.done).length;
    totalDone   += cat.tasks.filter(t =>  t.done).length;
    if (f !== 'all' && visible.length === 0) return;
    anyVisible = true;
    const done = cat.tasks.filter(t => t.done).length;
    html += `<div class="group-header">
      <div class="group-dot" style="background:${cat.color}"></div>
      <span class="group-label">${esc(cat.name)}</span>
      <span class="group-count">${done}/${cat.tasks.length}</span>
    </div>`;
    if (visible.length === 0) {
      html += `<div class="empty-group">No tasks yet</div>`;
    } else {
      visible.forEach(t => {
        html += `<div class="task-row">
          <div class="task-check ${t.done?'checked':''}" style="--cc:${cat.color}" onclick="toggleTask('${cat.id}','${t.id}')"></div>
          <div class="task-text ${t.done?'done':''}" contenteditable="true" onblur="editTask('${cat.id}','${t.id}',this.textContent)">${esc(t.text)}</div>
          <button class="icon-btn danger task-del" onclick="deleteTask('${cat.id}','${t.id}')">✕</button>
        </div>`;
      });
    }
  });
  el.innerHTML = anyVisible ? html : `<div class="empty-all">Nothing here yet — add your first task above.</div>`;
  document.getElementById('stats-line').textContent = `${totalActive} active · ${totalDone} done`;
}

// ── Task actions ─────────────────────────────────────
function addTask() {
  const input = document.getElementById('add-input');
  const text  = input.value.trim();
  const catId = document.getElementById('cat-select').value;
  if (!text || !catId) return;
  const cat = getCat(catId);
  if (!cat) return;
  cat.tasks.push({ id:uid(), text, done:false });
  input.value = ''; input.focus();
  scheduleSave(); render();
}
function toggleTask(catId, taskId) {
  const t = getCat(catId)?.tasks.find(t => t.id===taskId);
  if (t) t.done = !t.done;
  scheduleSave(); renderList();
}
function editTask(catId, taskId, newText) {
  const t = getCat(catId)?.tasks.find(t => t.id===taskId);
  const trimmed = newText.trim();
  if (t && trimmed) { t.text = trimmed; scheduleSave(); }
}
function deleteTask(catId, taskId) {
  const cat = getCat(catId);
  if (cat) cat.tasks = cat.tasks.filter(t => t.id!==taskId);
  scheduleSave(); render();
}

// ── Category actions ──────────────────────────────────
function renameCat(catId, name) {
  const cat = getCat(catId);
  if (cat && name.trim()) { cat.name = name.trim(); scheduleSave(); renderCatSelect(); renderList(); }
}
function moveCat(catId, dir) {
  const cats = state.categories;
  const idx = cats.findIndex(c => c.id===catId);
  const to  = idx + dir;
  if (to < 0 || to >= cats.length) return;
  [cats[idx], cats[to]] = [cats[to], cats[idx]];
  scheduleSave(); render();
}
function deleteCat(catId) {
  const cat = getCat(catId);
  if (!confirm(`Delete "${cat.name}" and all its tasks?`)) return;
  state.categories = state.categories.filter(c => c.id!==catId);
  scheduleSave(); render();
}

// ── Modal ─────────────────────────────────────────────
function buildSwatches(selected) {
  document.getElementById('color-grid').innerHTML = PALETTE.map(c =>
    `<div class="swatch${c===selected?' sel':''}" style="background:${c}" onclick="pickColor('${c}',this)"></div>`
  ).join('');
}
function pickColor(c, el) {
  pickedColor = c;
  document.querySelectorAll('.swatch').forEach(s => s.classList.remove('sel'));
  el.classList.add('sel');
}
function openModal(mode, catId) {
  modalMode = mode; modalCatId = catId || null;
  if (mode === 'add-cat') {
    document.getElementById('modal-title').textContent = 'New Category';
    document.getElementById('modal-name').value = '';
    pickedColor = PALETTE[0];
  } else {
    const cat = getCat(catId);
    document.getElementById('modal-title').textContent = 'Edit Category';
    document.getElementById('modal-name').value = cat.name;
    pickedColor = cat.color;
  }
  buildSwatches(pickedColor);
  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(() => document.getElementById('modal-name').focus(), 40);
}
function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); }
function overlayClick(e) { if (e.target===document.getElementById('modal-overlay')) closeModal(); }
function saveModal() {
  const name = document.getElementById('modal-name').value.trim();
  if (!name) { document.getElementById('modal-name').focus(); return; }
  if (modalMode === 'add-cat') {
    state.categories.push({ id:uid(), name, color:pickedColor, tasks:[] });
  } else {
    const cat = getCat(modalCatId);
    if (cat) { cat.name = name; cat.color = pickedColor; }
  }
  closeModal(); scheduleSave(); render();
}
document.getElementById('modal-name').addEventListener('keydown', e => {
  if (e.key==='Enter') saveModal();
  if (e.key==='Escape') closeModal();
});
</script>
</body>
</html>
